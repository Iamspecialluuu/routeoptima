{% extends 'base.html' %}
{% import '_icons.html' as ic %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}

{% block content %}
<div id="beforeView">
  <div class="welcome-header" style="margin-bottom:22px">
    <h1 class="welcome-title">Optimize Delivery Route</h1>
    <p class="welcome-sub">Enter pickup location and delivery points</p>
  </div>

  <div class="grid grid-split">
    <div class="card card-pad" style="padding:24px">
      <div class="opt-field-wrap">
        <label class="opt-field-label">Pickup Location</label>
        <input class="opt-depot-input" value="{{ depot_name }}" readonly>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px">
        <label class="opt-field-label" style="margin:0">Delivery Locations</label>
        <select id="algorithm" class="opt-algo-select">
          <option value="auto">Auto Algorithm</option>
          <option value="exact">Exact TSP</option>
          <option value="nearest">Nearest Neighbour</option>
        </select>
      </div>

      <div id="stopList" style="margin-top:4px"></div>

      <div class="add-location-row" style="margin-top:8px">
        <select id="addSelect" class="opt-add-select">
          <option value="">Select a delivery to add…</option>
          {% for d in deliveries %}
          <option value="{{ d.id }}"
                  data-lat="{{ d.latitude }}"
                  data-lng="{{ d.longitude }}"
                  data-name="{{ d.customer_name|e }}"
                  data-addr="{{ d.address|e }}">
            {{ d.customer_name }} — {{ d.address }}
          </option>
          {% endfor %}
        </select>
        <button type="button" id="addStopBtn" class="opt-add-btn">{{ ic.icon('plus') }} Add Location</button>
      </div>

      <button id="go" class="btn-optimize-primary">Optimize Route</button>
      <div id="err" class="flash flash-danger" style="display:none;margin-top:12px"></div>
    </div>

    <div class="map-col">
      <div class="map-wrap">
        <div class="map-toggle" id="mapToggle">
          <button type="button" data-mode="map" class="active">Map</button>
          <button type="button" data-mode="satellite">Satellite</button>
        </div>
        <div id="map" style="height:500px;"></div>
      </div>
    </div>
  </div>
</div>

<div id="afterView" style="display:none">
  <div class="welcome-header" style="margin-bottom:22px">
    <h1 class="welcome-title">Optimization Result</h1>
  </div>

  <div id="metricsRow" class="grid metrics-grid" style="margin-bottom:24px"></div>

  <div class="grid grid-split">
    <div class="card card-pad" style="padding:24px">
      <label class="opt-field-label" style="margin-bottom:12px;display:block">Optimized Visit Order</label>
      <div id="route-list"></div>

      <div style="display:flex;gap:12px;margin-top:24px">
        <button type="button" id="printBtn" class="btn-print">{{ ic.icon('reports') }} Print</button>
        <button type="button" id="downloadBtn" class="btn-download">{{ ic.icon('optimize') }} Download Route</button>
      </div>
    </div>

    <div class="map-col">
      <div class="map-wrap">
        <div class="map-toggle" id="mapToggle2">
          <button type="button" data-mode="map" class="active">Map</button>
          <button type="button" data-mode="satellite">Satellite</button>
        </div>
        <div id="map2" style="height:500px;"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const DEPOT = {
  lat: 4.8156,
  lng: 7.0498,
  name: {{ depot_name|tojson }}
};

let lmap, lmap2;
let lStreets, lSatellite, lStreets2, lSatellite2;
let lMarkers, lLines, lMarkers2, lLines2;
let selectedStops = [];
let lastRoute = null;
let mapReady = false;

/* ---------- Custom Pin ---------- */
function pinSvg(number) {
  return `
  <svg xmlns="http://www.w3.org/2000/svg" width="42" height="64" viewBox="0 0 42 64">
    <defs>
      <filter id="ds1" x="-80%" y="-80%" width="260%" height="260%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#000" flood-opacity="0.28"/>
      </filter>
      <radialGradient id="redPinG" cx="40%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff6b6b"/>
        <stop offset="55%" stop-color="#e0273a"/>
        <stop offset="100%" stop-color="#b81528"/>
      </radialGradient>
    </defs>
    <g filter="url(#ds1)">
      <rect x="5" y="46" width="32" height="15" rx="7.5" fill="#2130b8" stroke="#ffffff" stroke-width="2.2"/>
      <text x="21" y="57.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="900" fill="#ffffff">${number}</text>
    </g>
    <g filter="url(#ds1)">
      <path fill="url(#redPinG)" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"
        d="M21 2c7.7 0 14 6.3 14 14.1 0 10.5-14 26-14 26S7 26.6 7 16.1C7 8.3 13.3 2 21 2z"/>
      <circle cx="21" cy="16" r="5.4" fill="#ffffff"/>
      <circle cx="21" cy="16" r="2.6" fill="#e0273a"/>
    </g>
  </svg>`;
}

function pinIcon(number) {
  return L.divIcon({
    className: 'custom-pin',
    html: pinSvg(number),
    iconSize: [42, 64],
    iconAnchor: [21, 62],
    popupAnchor: [0, -56]
  });
}

/* ---------- Map Setup ---------- */
function setupToggle(id, map, streets, sat) {
  const bar = document.getElementById(id);
  if (!bar) return;
  bar.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    bar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.mode === 'satellite') {
      map.removeLayer(streets);
      sat.addTo(map);
    } else {
      map.removeLayer(sat);
      streets.addTo(map);
    }
  });
}

function initMap1() {
  lmap = L.map('map').setView([DEPOT.lat, DEPOT.lng], 12);
  lStreets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(lmap);
  lSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri', maxZoom: 19
  });
  lMarkers = L.layerGroup().addTo(lmap);
  lLines = L.layerGroup().addTo(lmap);
  setupToggle('mapToggle', lmap, lStreets, lSatellite);
  mapReady = true;
  setTimeout(() => lmap.invalidateSize(), 200);
  redrawMapStops();
}

function initMap2() {
  if (lmap2) {
    lmap2.remove();
  }
  lmap2 = L.map('map2').setView([DEPOT.lat, DEPOT.lng], 12);
  lStreets2 = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(lmap2);
  lSatellite2 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '© Esri', maxZoom: 19
  });
  lMarkers2 = L.layerGroup().addTo(lmap2);
  lLines2 = L.layerGroup().addTo(lmap2);
  setupToggle('mapToggle2', lmap2, lStreets2, lSatellite2);
}

/* ---------- Stop List ---------- */
function renderStopList() {
  const el = document.getElementById('stopList');
  if (!el) return;

  if (selectedStops.length === 0) {
    el.innerHTML = `<p style="color:#888;text-align:center;padding:20px;border:1px dashed #ccc;border-radius:8px;">
      No stops added yet.<br>Select a delivery and click "Add Location"
    </p>`;
    return;
  }

  el.innerHTML = selectedStops.map((s, i) => `
    <div class="opt-loc-row">
      <span class="opt-loc-num">${i + 1}</span>
      <span class="opt-loc-txt"><b>${s.name}</b><span>${s.addr}</span></span>
      <button type="button" class="x-remove" onclick="removeStop('${s.id}')">✕</button>
    </div>
  `).join('');
}

function removeStop(id) {
  selectedStops = selectedStops.filter(s => s.id !== id);
  renderStopList();
  redrawMapStops();
}

/* ---------- Draw before optimization ---------- */
function redrawMapStops() {
  if (!mapReady || !lmap) return;

  lMarkers.clearLayers();
  lLines.clearLayers();

  const points = [[DEPOT.lat, DEPOT.lng]];

  // Depot pin
  L.marker([DEPOT.lat, DEPOT.lng], {
    icon: pinIcon(1),
    zIndexOffset: 9999
  }).bindPopup(`<b>Start</b><br>${DEPOT.name}`).addTo(lMarkers);

  selectedStops.forEach((s, i) => {
    L.marker([s.lat, s.lng], {
      icon: pinIcon(i + 2)
    }).bindPopup(`<b>${i + 1}. ${s.name}</b><br>${s.addr}`).addTo(lMarkers);
    points.push([s.lat, s.lng]);
  });

  if (selectedStops.length > 0) {
    points.push([DEPOT.lat, DEPOT.lng]);

    L.polyline(points, { color: '#ffffff', weight: 15, opacity: 1 }).addTo(lLines);
    L.polyline(points, { color: '#1629ff', weight: 9, opacity: 1 }).addTo(lLines);
  }

  if (points.length > 2) {
    lmap.fitBounds(points, { padding: [40, 40] });
  }
}

/* ---------- Draw after optimization ---------- */
function drawResultMap(route) {
  if (!lmap2) return;

  lMarkers2.clearLayers();
  lLines2.clearLayers();

  const points = [];

  route.forEach((x, i) => {
    const lat = parseFloat(x.latitude);
    const lng = parseFloat(x.longitude);
    if (isNaN(lat) || isNaN(lng)) return;

    points.push([lat, lng]);

    if (x.is_depot_start) {
      L.marker([lat, lng], { icon: pinIcon(1), zIndexOffset: 9999 })
        .bindPopup(`<b>1. Start</b><br>${x.customer_name || ''}`)
        .addTo(lMarkers2);
    } else if (!x.is_depot_end) {
      L.marker([lat, lng], { icon: pinIcon(i + 1) })
        .bindPopup(`<b>${i + 1}. ${x.customer_name}</b><br>${x.address || ''}`)
        .addTo(lMarkers2);
    }
  });

  if (points.length >= 2) {
    L.polyline(points, { color: '#ffffff', weight: 16, opacity: 1 }).addTo(lLines2);
    L.polyline(points, { color: '#1629ff', weight: 10, opacity: 1 }).addTo(lLines2);
  }

  setTimeout(() => {
    lmap2.invalidateSize();
    if (points.length) {
      lmap2.fitBounds(points, { padding: [50, 50] });
    }
  }, 200);
}

/* ---------- Main Logic ---------- */
document.addEventListener('DOMContentLoaded', () => {
  // Initialize first map
  initMap1();
  renderStopList();

  // Add stop button
  document.getElementById('addStopBtn').addEventListener('click', () => {
    const sel = document.getElementById('addSelect');
    const opt = sel.options[sel.selectedIndex];
    if (!opt || !opt.value) return;

    const id = opt.value;
    if (selectedStops.find(s => s.id === id)) return;

    selectedStops.push({
      id: id,
      name: opt.dataset.name,
      addr: opt.dataset.addr,
      lat: parseFloat(opt.dataset.lat),
      lng: parseFloat(opt.dataset.lng)
    });

    sel.value = '';
    renderStopList();
    redrawMapStops();
  });

  // Optimize button
  document.getElementById('go').addEventListener('click', async () => {
    const err = document.getElementById('err');
    err.style.display = 'none';

    if (selectedStops.length < 2) {
      err.textContent = 'Please add at least 2 delivery locations';
      err.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('{{ url_for("api_optimize") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          delivery_ids: selectedStops.map(s => s.id),
          algorithm: document.getElementById('algorithm').value
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Optimization failed');

      lastRoute = data;

      // Show result view
      document.getElementById('beforeView').style.display = 'none';
      document.getElementById('afterView').style.display = 'block';

      // Metrics
      const mins = data.estimated_minutes;
      const timeLabel = mins >= 60
        ? `${Math.floor(mins/60)} h ${mins%60} mins`
        : `${mins} mins`;

      document.getElementById('metricsRow').innerHTML = `
        <div class="res-card"><div class="res-card-label">TOTAL DISTANCE</div><div class="res-card-val">${data.total_distance} km</div></div>
        <div class="res-card"><div class="res-card-label">ESTIMATED TIME</div><div class="res-card-val">${timeLabel}</div></div>
        <div class="res-card"><div class="res-card-label">TOTAL STOPS</div><div class="res-card-val">${data.total_stops}</div></div>
        <div class="res-card"><div class="res-card-label">ALGORITHM</div><div class="res-card-val">${data.algorithm}</div></div>
        <div class="res-card"><div class="res-card-label">DATE</div><div class="res-card-val">${data.date}</div></div>
      `;

      // Visit order
      document.getElementById('route-list').innerHTML = data.route.map((x, i) => {
        let name = x.customer_name || '';
        if (x.is_depot_start) name += ' (Start)';
        if (x.is_depot_end) name = 'Return to Start';
        return `
          <div class="opt-loc-row">
            <span class="opt-loc-num">${i + 1}</span>
            <span class="opt-loc-txt"><b>${name}</b>${x.address && !x.is_depot_end ? `<span>${x.address}</span>` : ''}</span>
          </div>`;
      }).join('');

      // Initialize result map
      setTimeout(() => {
        initMap2();
        setTimeout(() => {
          drawResultMap(data.route);
        }, 300);
      }, 100);

    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
    }
  });

  // Print & Download
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!lastRoute) return;
    let csv = 'Stop,Location,Address,Latitude,Longitude\n';
    lastRoute.route.forEach((r, i) => {
      let name = r.is_depot_end ? 'Return to Start' : (r.customer_name || '');
      csv += `${i+1},"${name}","${r.address||''}",${r.latitude},${r.longitude}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'optimized_route.csv';
    a.click();
  });
});
</script>
{% endblock %}
