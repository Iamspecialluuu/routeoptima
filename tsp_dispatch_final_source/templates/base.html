<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title or 'TSP Dispatch System'}}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body>{% if session.get('admin_id') %}<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="{{url_for('dashboard')}}">TSP Dispatch</a><div class="navbar-nav"><a class="nav-link" href="{{url_for('dashboard')}}">Dashboard</a><a class="nav-link" href="{{url_for('riders')}}">Riders</a><a class="nav-link" href="{{url_for('deliveries')}}">Deliveries</a><a class="nav-link" href="{{url_for('optimize')}}">Optimize Route</a><a class="nav-link" href="{{url_for('history')}}">History</a><a class="nav-link" href="{{url_for('backend')}}">Backend</a><a class="nav-link" href="{{url_for('logout')}}">Logout</a></div></div></nav>{% endif %}<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
