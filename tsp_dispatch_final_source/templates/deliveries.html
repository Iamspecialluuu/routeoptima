{% extends 'base.html' %}{% block content %}<h1>Delivery Management</h1><div class="card shadow-sm p-3 my-3"><form method="post" class="row g-2"><input class="form-control" name="customer_name" placeholder="Customer" required><input class="form-control" name="address" placeholder="Address / area" required><input class="form-control" name="latitude" placeholder="Latitude" required><input class="form-control" name="longitude" placeholder="Longitude" required><select class="form-select" name="rider_id"><option value="">Unassigned</option>{% for r in riders %}<option value="{{r.id}}">{{r.name}}</option>{% endfor %}</select><input type="hidden" name="status" value="Pending"><button class="btn btn-primary">Add Delivery</button></form></div><div class="table-responsive"><table class="table table-striped table-bordered"><tr><th>Customer</th><th>Address</th><th>Coordinates</th><th>Rider</th><th>Status</th></tr>{% for d in deliveries %}<tr><td>{{d.customer_name}}</td><td>{{d.address}}</td><td>{{d.latitude}}, {{d.longitude}}</td><td>{{d.rider_name or 'Unassigned'}}</td><td><form method="post" action="{{url_for('delivery_status',delivery_id=d.id)}}"><select name="status" onchange="this.form.submit()" class="form-select form-select-sm"><option {{'selected' if d.status=='Pending'}}>Pending</option><option {{'selected' if d.status=='Assigned'}}>Assigned</option><option {{'selected' if d.status=='Delivered'}}>Delivered</option></select></form></td></tr>{% endfor %}</table></div>{% endblock %}
