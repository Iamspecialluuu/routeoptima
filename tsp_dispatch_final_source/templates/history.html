{% extends 'base.html' %}{% block content %}<h1>Route History</h1><div class="table-responsive"><table class="table table-striped table-bordered"><tr><th>Date</th><th>Algorithm</th><th>Stops</th><th>Distance</th><th>Execution</th></tr>{% for h in history %}<tr><td>{{h.created_at}}</td><td>{{h.algorithm}}</td><td>{{h.stop_count}}</td><td>{{h.total_distance}} km</td><td>{{h.execution_ms}} ms</td></tr>{% else %}<tr><td colspan="5">No route history yet.</td></tr>{% endfor %}</table></div>{% endblock %}
