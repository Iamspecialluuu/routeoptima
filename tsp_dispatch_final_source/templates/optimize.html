{% extends 'base.html' %}{% block content %}<h1>Route Optimization</h1><div class="row g-3"><div class="col-lg-4"><div class="card shadow-sm p-3"><select id="algorithm" class="form-select mb-3"><option value="auto">Automatic</option><option value="exact">Exact TSP</option><option value="nearest">Nearest Neighbour</option></select>{% for d in deliveries %}<label class="border rounded p-2 mb-2 d-block"><input class="delivery-check" type="checkbox" value="{{d.id}}"> <b>{{d.customer_name}}</b><br><small>{{d.address}}</small></label>{% endfor %}<button id="go" class="btn btn-primary w-100">Calculate Optimized Route</button><div id="err" class="alert alert-danger mt-2 d-none"></div></div></div><div class="col-lg-8"><div id="map" class="map"><div class="map-placeholder">Configure GOOGLE_MAPS_API_KEY to enable Google Maps.</div></div></div></div><div id="results" class="card shadow-sm p-3 mt-3 d-none"><h4>Optimization Result</h4><div id="metrics" class="row g-2"></div><ol id="route"></ol></div>{% endblock %}{% block scripts %}<script>let map,ds,dr;function initMap(){map=new google.maps.Map(document.getElementById('map'),{center:{lat:4.8156,lng:7.0498},zoom:12});ds=new google.maps.DirectionsService();dr=new google.maps.DirectionsRenderer({map});}document.getElementById('go').onclick=async()=>{let ids=[...document.querySelectorAll('.delivery-check:checked')].map(x=>x.value),e=document.getElementById('err');e.classList.add('d-none');try{let r=await fetch('{{url_for("api_optimize")}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delivery_ids:ids,algorithm:document.getElementById('algorithm').value})}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('results').classList.remove('d-none');document.getElementById('metrics').innerHTML=[['Algorithm',d.algorithm],['Before',d.before_distance+' km'],['Optimized',d.total_distance+' km'],['Saved',d.distance_saved+' km'],['Improvement',d.improvement+'%'],['Execution',d.execution_ms+' ms']].map(x=>'<div class="col-md-2"><div class="metric-box"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div></div>').join('');document.getElementById('route').innerHTML=d.route.map((x,i)=>'<li>'+((i==d.route.length-1)?'Return to Depot':x.customer_name+' — '+x.address)+'</li>').join('');if(window.google&&d.route.length>2){let w=d.route.slice(1,-1).map(x=>({location:{lat:x.latitude,lng:x.longitude},stopover:true}));ds.route({origin:{lat:d.route[0].latitude,lng:d.route[0].longitude},destination:{lat:d.route[d.route.length-1].latitude,lng:d.route[d.route.length-1].longitude},waypoints:w,travelMode:google.maps.TravelMode.DRIVING},(res,s)=>{if(s==='OK')dr.setDirections(res);});}}catch(x){e.textContent=x.message;e.classList.remove('d-none');}};</script>{% if google_maps_api_key!='YOUR_GOOGLE_MAPS_API_KEY' %}<script async defer src="https://maps.googleapis.com/maps/api/js?key={{google_maps_api_key}}&callback=initMap"></script>{% endif %}{% endblock %}
