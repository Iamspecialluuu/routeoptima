{% extends 'base.html' %}{% block content %}<h1>Riders Management</h1><div class="card shadow-sm p-3 my-3"><form method="post" class="row g-2"><input class="form-control col" name="name" placeholder="Name" required><input class="form-control col" name="phone" placeholder="Phone" required><select class="form-select col" name="status"><option>Available</option><option>On Delivery</option><option>Offline</option></select><input class="form-control col" name="latitude" placeholder="Latitude" required><input class="form-control col" name="longitude" placeholder="Longitude" required><button class="btn btn-primary col">Add Rider</button></form></div><div class="table-responsive"><table class="table table-striped table-bordered"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Status</th><th>Coordinates</th><th></th></tr>{% for r in riders %}<tr><td>{{r.id}}</td><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.status}}</td><td>{{r.latitude}}, {{r.longitude}}</td><td><form method="post" action="{{url_for('delete_rider',rider_id=r.id)}}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
